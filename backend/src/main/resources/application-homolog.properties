spring.application.name=combinado
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/combinado_homolog}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:ifpb}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET:combinadosecretkeyparahomologacaoevalidacao1234567890}
jwt.expiration=${JWT_EXPIRATION:86400000}

springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
logging.level.root=INFO
logging.level.br.edu.ifpb.combinado=INFO
